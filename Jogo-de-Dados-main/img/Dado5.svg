<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="diceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="redDotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="80" height="80" rx="15" fill="url(#diceGrad)" filter="url(#shadow)" stroke="#cbd5e1" stroke-width="1" />
  <circle cx="30" cy="30" r="8" fill="url(#dotGrad)" /><circle cx="70" cy="30" r="8" fill="url(#dotGrad)" /><circle cx="50" cy="50" r="8" fill="url(#dotGrad)" /><circle cx="30" cy="70" r="8" fill="url(#dotGrad)" /><circle cx="70" cy="70" r="8" fill="url(#dotGrad)" />
</svg>